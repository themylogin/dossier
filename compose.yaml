services:
  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ${DATA_DIR:-./data}:/data

  downloader:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "dossier.downloader", "run"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "dossier.backend.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DOWNLOADER_URL: ws://downloader:8090
      OPENCLAW_URL: ${OPENCLAW_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-}
      OPENCLAW_EXPORT_PATH: ${OPENCLAW_EXPORT_PATH:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${OPENCLAW_EXPORT_DIR:-./exports}:/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      downloader:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  test:
    profiles: [test]
    build:
      context: .
      target: test

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: build
    environment:
      TZ: UTC
    command: ["npm", "run", "test:run"]
