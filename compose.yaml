services:
  backend:
    build:
      context: ./backend
      target: runtime

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: build
    environment:
      TZ: UTC
    command: ["npm", "run", "test:run"]

  e2e:
    profiles: [e2e]
    build: ./e2e
    depends_on:
      frontend:
        condition: service_healthy
    init: true
    ipc: host
    volumes:
      - ./e2e/test-results:/e2e/test-results
