[project]
name = "dossier"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "jsonrpcserver>=5.2.0",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "telethon>=1.46.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
files = ["dossier", "migrations", "tests"]

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-async
    "ASYNC",
    # flake8-tidy-imports
    "TID",
    # isort
    "I",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
